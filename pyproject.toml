[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpxkit"
version = "0.1.0"
description = "HWPX 문서 엔진 (hwp-helper 플러그인)"
requires-python = ">=3.10"
dependencies = ["lxml>=4.9", "Pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["hwpxkit", "hwpxkit.editor"]

[tool.setuptools.package-data]
hwpxkit = ["*.ps1"]
"hwpxkit.editor" = ["page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hangul: 한글(한컴오피스)이 설치된 Windows에서만 실행"]
